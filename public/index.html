<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101820">
    <title>ARMA</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101820; color: #f4f5f5; }
      main { width: min(100% - 3rem, 42rem); }
      h1 { margin: 0 0 1rem; font-size: clamp(3rem, 12vw, 6rem); letter-spacing: -.06em; }
      p { margin: 0; color: #c5ccce; font-size: 1.125rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>ARMA</h1>
      <p>Сайт готується. Інформація з’явиться незабаром.</p>
    </main>
  </body>
</html>
