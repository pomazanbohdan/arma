name: Publish voting dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.window.outputs.publish }}
    steps:
      - name: Limit scheduled updates to the voting period
        id: window
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(date -u +%Y%m%d)" -ge 20261006 ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.window.outputs.publish == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.publish == 'true'
        with:
          node-version: '22'
      - name: Validate parser
        if: steps.window.outputs.publish == 'true'
        run: node --test tests/report.test.mjs
      - name: Fetch and validate the public report
        if: steps.window.outputs.publish == 'true'
        run: node scripts/prepare.mjs
      - uses: actions/configure-pages@v5
        if: steps.window.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.window.outputs.publish == 'true'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
